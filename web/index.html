<!doctype html>
<html lang="en" class="light" style="color-scheme: only light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#fdf2f7" />
    <!-- Keep the application in light mode before first paint so persisted or
         system dark-mode preferences can never flash a dark UI. -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.remove('dark')
        root.classList.add('light')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
